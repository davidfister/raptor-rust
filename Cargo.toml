[package]
name = "rust-raptor"
version = "0.1.0"
edition = "2021"

[dependencies]
rust_qsim = { git = "https://github.com/matsim-vsp/parallel_qsim_rust" }
rand = "0.9.4"
hotpath = "0.23"
criterion = "0.8"
tonic = "0.14"
prost = "0.14"
tonic-prost = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
hotpath = ["hotpath/hotpath"]
hotpath-cpu = ["hotpath/hotpath-cpu"]
hotpath-alloc = ["hotpath/hotpath-alloc"]

[[bench]]
name = "bench_raptor"
harness = false

[profile.release]
debug = true

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true

[build-dependencies]
tonic-prost-build = "0.14.6"