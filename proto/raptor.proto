syntax = "proto3";

package routing;

service RoutingService {
  rpc GetRoute (Request) returns (Response);
}

message Coordinate {
  double x = 1;
  double y = 2;
}

message Request {
  Coordinate start = 1;
  Coordinate destination = 2;
  uint32 rounds = 3;
}

message Response {
  uint64 duration_seconds = 1;
}